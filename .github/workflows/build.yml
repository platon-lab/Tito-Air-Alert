name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Підтягнути MapView (необов'язково)
        run: |
          pip install --no-deps --target vendor kivy_garden.mapview || true
          if [ -d vendor/kivy_garden ]; then cp -r vendor/kivy_garden ./; fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Залежності
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
          pip install --upgrade pip
          pip install --upgrade buildozer "cython==0.29.36"

      - name: Кеш Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Збірка APK
        run: buildozer -v android debug

      - name: Завантажити APK
        uses: actions/upload-artifact@v4
        with:
          name: tito-air-alert-apk
          path: bin/*.apk
